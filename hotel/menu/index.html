<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apna Dhaba — Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink:   #e74694;
      --pink2:  #c2336e;
      --purple: #7551ff;
      --grad:   linear-gradient(180deg, #3d1259 0%, #1a103a 40%, #0d1224 100%);
      --green:  #16a34a;
      --red:    #dc2626;
      --accent: #e0aaff;

      /* fluid font scale — grows smoothly from mobile → desktop */
      --fs-xs:   clamp(11px, 2.5vw, 14px);
      --fs-sm:   clamp(13px, 3vw,   16px);
      --fs-md:   clamp(15px, 3.5vw, 19px);
      --fs-lg:   clamp(18px, 4.5vw, 24px);
      --fs-xl:   clamp(22px, 5.5vw, 32px);

      /* fluid spacing */
      --sp-xs: clamp(6px,  1.5vw, 10px);
      --sp-sm: clamp(10px, 2.5vw, 16px);
      --sp-md: clamp(14px, 3.5vw, 22px);
      --sp-lg: clamp(18px, 4.5vw, 30px);
    }

    html { font-size: 16px; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--grad);
      min-height: 100vh;
      padding: clamp(12px, 3vw, 32px) clamp(10px, 3vw, 20px) clamp(140px, 20vw, 200px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: clamp(340px, 90vw, 600px);
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(231,70,148,0.2);
      border-radius: clamp(16px, 4vw, 26px);
      overflow: hidden;
    }

    /* HEADER */
    .hdr {
      background: linear-gradient(135deg, #e74694, #c2336e 50%, #7551ff);
      padding: var(--sp-md) var(--sp-lg);
      display: flex; align-items: center; gap: var(--sp-sm);
    }
    .hdr-logo {
      width: clamp(40px, 9vw, 56px);
      height: clamp(40px, 9vw, 56px);
      border-radius: clamp(10px, 2.5vw, 14px);
      background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-sm); font-weight: 900; color: #fff; flex-shrink: 0;
    }
    .hdr-title { font-size: var(--fs-lg); font-weight: 900; color: #fff; }
    .hdr-sub   { font-size: var(--fs-xs); color: rgba(255,255,255,0.6); margin-top: 2px; }
    .hdr .live {
      margin-left: auto;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; font-size: var(--fs-xs); font-weight: 700;
      padding: clamp(4px,1vw,7px) clamp(8px,2vw,14px); border-radius: 20px;
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .ldot { width: clamp(6px,1.5vw,8px); height: clamp(6px,1.5vw,8px); border-radius: 50%; background: #4ade80; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,0.6)} 50%{box-shadow:0 0 0 6px rgba(74,222,128,0)} }

    /* CUSTOMER */
    .cust {
      background: rgba(231,70,148,0.08);
      border-bottom: 1px solid rgba(231,70,148,0.2);
      padding: var(--sp-sm) var(--sp-md);
    }
    .cust-lbl { font-size: var(--fs-xs); font-weight: 700; color: var(--pink); text-transform: uppercase; letter-spacing: .1em; margin-bottom: var(--sp-xs); }
    .cust-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-xs); }
    .fw { display: flex; flex-direction: column; gap: clamp(3px,1vw,6px); }
    .fw label { font-size: var(--fs-xs); font-weight: 700; color: rgba(255,255,255,0.5); }
    .fw input {
      background: rgba(255,255,255,0.08); border: 2px solid rgba(231,70,148,0.25);
      border-radius: clamp(8px,2vw,12px); padding: clamp(9px,2vw,13px) clamp(10px,2.5vw,16px);
      color: #fff; font-family: inherit; font-size: var(--fs-sm); font-weight: 600; outline: none;
      transition: border-color .15s;
    }
    .fw input:focus { border-color: var(--pink); }
    .fw input::placeholder { color: rgba(255,255,255,0.25); font-weight: 400; }

    /* MENU BODY */
    .mbody { padding: var(--sp-sm); }

    /* SPINNER */
    .loading { display: flex; flex-direction: column; align-items: center; padding: clamp(40px,8vw,70px) 20px; gap: var(--sp-sm); }
    .spin { width: clamp(36px,8vw,50px); height: clamp(36px,8vw,50px); border: 3px solid rgba(231,70,148,0.2); border-top-color: var(--pink); border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: rgba(255,255,255,0.4); font-size: var(--fs-sm); }

    /* CATEGORY BLOCK */
    .cat-block { margin-bottom: var(--sp-xs); border-radius: clamp(12px,3vw,18px); overflow: hidden; border: 1px solid rgba(231,70,148,0.18); }

    .cat-head {
      display: flex; align-items: center; gap: var(--sp-xs);
      padding: clamp(12px,3vw,18px) clamp(14px,3.5vw,22px);
      cursor: pointer; user-select: none;
      background: rgba(231,70,148,0.08);
      transition: background .18s;
    }
    .cat-block.open .cat-head {
      background: linear-gradient(135deg, #e74694, #c2336e 60%, #7551ff);
    }
    .cat-emoji { font-size: var(--fs-md); flex-shrink: 0; }
    .cat-name  { flex: 1; font-size: var(--fs-md); font-weight: 800; color: var(--pink); transition: color .18s; }
    .cat-block.open .cat-name { color: #fff; }
    .cat-pill {
      font-size: var(--fs-xs); font-weight: 700;
      padding: clamp(2px,0.6vw,5px) clamp(7px,1.8vw,12px); border-radius: 20px;
      background: rgba(231,70,148,0.15); color: var(--pink); transition: all .18s; flex-shrink: 0;
    }
    .cat-block.open .cat-pill { background: rgba(255,255,255,0.2); color: #fff; }
    .cat-arr { font-size: var(--fs-xs); color: rgba(255,255,255,0.4); transition: transform .28s cubic-bezier(.34,1.56,.64,1); flex-shrink: 0; }
    .cat-block.open .cat-arr { transform: rotate(180deg); color: rgba(255,255,255,0.8); }

    .cat-panel { max-height: 0; overflow: hidden; transition: max-height .35s cubic-bezier(.4,0,.2,1); background: rgba(255,255,255,0.03); }
    .cat-block.open .cat-panel { max-height: 3000px; }

    /* ITEM ROW */
    .item-row {
      display: flex; align-items: center; gap: var(--sp-sm);
      padding: clamp(12px,3vw,18px) clamp(12px,3vw,20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: all .2s cubic-bezier(.34,1.56,.64,1); position: relative;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover {
      background: rgba(231,70,148,0.08);
      transform: scale(1.012) translateY(-1px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 0 1px rgba(231,70,148,0.2);
      border-radius: clamp(10px,2.5vw,14px); z-index: 2;
    }

    .item-img {
      width:  clamp(52px, 12vw, 72px);
      height: clamp(52px, 12vw, 72px);
      flex-shrink: 0; border-radius: clamp(10px,2.5vw,14px);
      background: rgba(231,70,148,0.12); border: 1.5px solid rgba(231,70,148,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(20px,5vw,30px); overflow: hidden;
    }
    .item-img img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }

    .vdot {
      width: clamp(14px,3.5vw,18px); height: clamp(14px,3.5vw,18px);
      flex-shrink: 0; border-radius: 3px; border: 2px solid;
      display: flex; align-items: center; justify-content: center;
      align-self: flex-start; margin-top: 3px;
    }
    .vdot::after { content:''; width:clamp(5px,1.2vw,7px); height:clamp(5px,1.2vw,7px); border-radius:50%; background:currentColor; }
    .vdot.veg     { color: var(--green); border-color: var(--green); }
    .vdot.non-veg { color: var(--red);   border-color: var(--red); }

    .item-info { flex: 1; min-width: 0; }
    .item-name  { font-size: var(--fs-sm);  font-weight: 700; color: #fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item-desc  { font-size: var(--fs-xs);  color: rgba(255,255,255,0.4); margin-top: 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item-price { font-size: var(--fs-md);  font-weight: 900; color: var(--accent); flex-shrink: 0; }

    /* QTY */
    .qty { display:flex; align-items:center; flex-shrink:0; }
    .qb {
      width:  clamp(30px, 8vw, 42px);
      height: clamp(30px, 8vw, 42px);
      background: rgba(231,70,148,0.15); border: 1.5px solid rgba(231,70,148,0.3);
      color: var(--pink); font-size: clamp(16px,4vw,22px); font-weight: 700;
      cursor: pointer; display:flex; align-items:center; justify-content:center;
      transition: all .15s; user-select:none; touch-action: manipulation;
    }
    .qb:first-child { border-radius: clamp(7px,2vw,10px) 0 0 clamp(7px,2vw,10px); }
    .qb:last-child  { border-radius: 0 clamp(7px,2vw,10px) clamp(7px,2vw,10px) 0; }
    .qb:hover, .qb:active { background: var(--pink); color: #fff; border-color: var(--pink); }
    .qi {
      width: clamp(34px,8vw,46px); height: clamp(30px,8vw,42px);
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(231,70,148,0.2); border-left: none; border-right: none;
      color: #fff; text-align:center; font-family:inherit;
      font-size: var(--fs-sm); font-weight:800; outline:none;
    }
    .qi::-webkit-inner-spin-button, .qi::-webkit-outer-spin-button { -webkit-appearance:none; }

    /* FOOTER */
    .footer {
      position: fixed; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: clamp(340px, 90vw, 600px);
      background: rgba(10,6,26,0.97);
      border: 1.5px solid rgba(231,70,148,0.3); border-bottom: none;
      border-radius: clamp(16px,4vw,24px) clamp(16px,4vw,24px) 0 0;
      padding: clamp(12px,3vw,18px) clamp(14px,4vw,24px) clamp(22px,5vw,32px);
      backdrop-filter: blur(24px);
      z-index: 200;
    }
    .foot-row { display:flex; align-items:center; justify-content:space-between; margin-bottom: clamp(10px,2.5vw,16px); }
    .foot-lbl { font-size: var(--fs-xs); font-weight:700; color:rgba(255,255,255,0.35); text-transform:uppercase; letter-spacing:.07em; }
    .foot-sub { font-size: var(--fs-xs); color:rgba(255,255,255,0.2); margin-top:3px; }
    .foot-amt .sym { font-size: var(--fs-md); color:var(--pink); font-weight:700; }
    .foot-amt .num { font-size: var(--fs-xl); font-weight:900; color:#fff; letter-spacing:-.03em; }
    .obtn {
      width:100%;
      background: linear-gradient(135deg, #e74694, #c2336e 50%, #7551ff);
      border:none; border-radius: clamp(12px,3vw,16px);
      padding: clamp(14px,3.5vw,20px);
      color:#fff; font-family:inherit; font-size: var(--fs-md); font-weight:900;
      cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
      transition: opacity .15s, transform .15s;
      box-shadow: 0 4px 24px rgba(231,70,148,0.45);
      touch-action: manipulation;
    }
    .obtn:hover:not(:disabled) { opacity:.9; transform:translateY(-2px); }
    .obtn:disabled { opacity:.3; cursor:not-allowed; transform:none; }

    /* SUCCESS */
    .sov { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.75); backdrop-filter:blur(12px); display:none; align-items:center; justify-content:center; padding: 20px; }
    .sov.show { display:flex; }
    .sbox {
      background:#fff; border:2px solid rgba(231,70,148,0.3); border-radius: clamp(18px,4vw,26px);
      padding: clamp(28px,6vw,44px) clamp(22px,5vw,36px);
      text-align:center; max-width: clamp(280px,80vw,400px); width:100%;
      animation:popIn .3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
    .sbox .si { font-size: clamp(48px,12vw,72px); margin-bottom:12px; }
    .sbox h2  { font-size: var(--fs-lg);  font-weight:900; color:#111; margin-bottom:8px; }
    .sbox p   { color:#888; font-size: var(--fs-sm); line-height:1.65; }
    .soid {
      margin: clamp(12px,3vw,18px) 0;
      background:#fdf4fb; border:1.5px solid #f5d0ea; border-radius:10px;
      padding: clamp(8px,2vw,12px) clamp(12px,3vw,18px);
      font-size: var(--fs-sm); font-weight:700; color:var(--pink2);
    }
    .sclose {
      width:100%; background:linear-gradient(135deg,#e74694,#7551ff); border:none;
      border-radius: clamp(11px,2.5vw,15px); padding: clamp(13px,3.5vw,18px);
      color:#fff; font-family:inherit; font-size: var(--fs-md); font-weight:900; cursor:pointer;
    }

    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .shake { animation:shake .3s ease; }

    /* Mobile fine-tuning */
    @media (max-width: 400px) {
      .cust-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-logo">AD</div>
    <div>
      <div class="hdr-title">Apna Dhaba</div>
      <div class="hdr-sub">Place your order below</div>
    </div>
    <div class="live"><div class="ldot"></div> Live Menu</div>
  </div>

  <!-- CUSTOMER -->
  <div class="cust">
    <div class="cust-lbl"><i class="fas fa-user" style="margin-right:5px"></i>Your Details</div>
    <div class="cust-row">
      <div class="fw">
        <label>Full Name</label>
        <input type="text" id="custName" placeholder="Rahul Sharma" />
      </div>
      <div class="fw">
        <label>WhatsApp Number</label>
        <input type="tel" id="custPhone" placeholder="9876543210" maxlength="10" />
      </div>
    </div>
  </div>

  <!-- MENU -->
  <div class="mbody" id="mbody">
    <div class="loading">
      <div class="spin"></div>
      <p>Fetching menu…</p>
    </div>
  </div>

</div><!-- /card -->

<!-- FOOTER -->
<div class="footer">
  <div class="foot-row">
    <div>
      <div class="foot-lbl">Total Amount</div>
      <div class="foot-sub" id="footSub">No items selected</div>
    </div>
    <div class="foot-amt"><span class="sym">₹</span><span class="num" id="footNum">0</span></div>
  </div>
  <button class="obtn" id="obtn" disabled onclick="placeOrder()">
    <i class="fas fa-shopping-bag"></i> Order Now
  </button>
</div>

<!-- SUCCESS -->
<div class="sov" id="sov">
  <div class="sbox">
    <div class="si">🎉</div>
    <h2>Order Placed!</h2>
    <p>Your order is confirmed.<br>Invoice coming on WhatsApp.</p>
    <div class="soid" id="soid">Order ID: —</div>
    <button class="sclose" onclick="resetOrder()">Place Another Order</button>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzxth-xMywmI5DbCxKNREE0swxhIX8PafugddVPKjTnEOkbBQmCw0Ok7GVZxe4sfln3/exec';

const ICONS = {
  'starter':'🥗','starters':'🥗','main course':'🍛','main':'🍛','mains':'🍛',
  'breads':'🫓','bread':'🫓','roti':'🫓','rice':'🍚','biryani':'🫕',
  'drinks':'🥤','beverages':'🥤','desserts':'🍮','dessert':'🍮',
  'soups':'🍲','soup':'🍲','snacks':'🍟','snack':'🍟',
  'chicken':'🍗','seafood':'🦐','paneer':'🧀','dal':'🥣',
};
const ico = c => ICONS[String(c).toLowerCase()] || '🍽';

// FETCH
fetch(API + '?action=getMenuItems&t=' + Date.now())
  .then(r => r.json())
  .then(r => {
    const items = (r.items || []).filter(m => {
      const av = String(m['Available'] || '').trim().toLowerCase();
      return av === 'yes' || av === 'y';
    });
    buildMenu(items);
  })
  .catch(err => {
    document.getElementById('mbody').innerHTML =
      `<div style="text-align:center;padding:50px 20px;color:rgba(255,255,255,0.3)">
        <i class="fas fa-wifi-slash" style="font-size:28px;display:block;margin-bottom:10px;color:rgba(231,70,148,0.4)"></i>
        <p style="color:#fff;font-weight:700;font-size:14px">Couldn't load menu</p>
        <p style="font-size:11px;margin-top:5px"><a href="" style="color:#e74694">Tap to retry</a></p>
        <p style="font-size:10px;margin-top:4px;color:rgba(255,255,255,0.2)">${err.message}</p>
      </div>`;
  });

function buildMenu(items) {
  if (!items.length) {
    document.getElementById('mbody').innerHTML =
      `<div style="text-align:center;padding:50px;color:rgba(255,255,255,0.3)">No items available.</div>`;
    return;
  }

  const grouped = {};
  items.forEach(m => {
    const cat = (m['Category'] || 'Other').trim();
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(m);
  });

  document.getElementById('mbody').innerHTML = Object.entries(grouped).map(([cat, catItems], ci) => `
    <div class="cat-block" id="cb${ci}">
      <div class="cat-head" onclick="tog(${ci})">
        <span class="cat-emoji">${ico(cat)}</span>
        <span class="cat-name">${cat}</span>
        <span class="cat-pill">${catItems.length}</span>
        <i class="fas fa-chevron-down cat-arr"></i>
      </div>
      <div class="cat-panel">
        ${catItems.map((m, j) => {
          const name  = (m['Item Name'] || m['Name'] || 'Item').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
          const price = Number(m['Price'] || m['Price (Rs)'] || 0);
          const desc  = m['Description'] || '';
          const img   = m['Image'] || m['Image URL'] || '';
          const isNv  = String(m['Type'] || m['Veg/Non-Veg'] || '').toLowerCase().includes('non');
          const uid   = 'q' + ci + '_' + j;
          const imgHtml = img
            ? `<img src="${img}" alt="" onerror="this.outerHTML='<span style=font-size:18px>${ico(cat)}</span>'" />`
            : `<span style="font-size:18px">${ico(cat)}</span>`;
          return `<div class="item-row">
            <div class="item-img">${imgHtml}</div>
            <div class="vdot ${isNv ? 'non-veg' : 'veg'}"></div>
            <div class="item-info">
              <div class="item-name">${name}</div>
              ${desc ? `<div class="item-desc">${desc}</div>` : ''}
            </div>
            <div class="item-price">₹${price}</div>
            <div class="qty">
              <button class="qb" onclick="chg('${uid}',-1)">−</button>
              <input class="qi" type="number" id="${uid}" value="0" min="0" max="20"
                data-name="${name}" data-price="${price}"
                oninput="clamp(this);calc()" />
              <button class="qb" onclick="chg('${uid}',1)">＋</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}

function tog(ci) {
  const el = document.getElementById('cb' + ci);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.cat-block.open').forEach(b => b.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}

function chg(id, d) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = Math.max(0, Math.min(20, parseInt(el.value || 0) + d));
  calc();
}
function clamp(el) {
  let v = parseInt(el.value || 0);
  el.value = isNaN(v) || v < 0 ? 0 : v > 20 ? 20 : v;
}

function calc() {
  let total = 0, parts = [], count = 0;
  document.querySelectorAll('.qi').forEach(el => {
    const qty = parseInt(el.value || 0);
    if (qty > 0) {
      total += qty * Number(el.dataset.price || 0);
      parts.push(el.dataset.name + ' ×' + qty);
      count++;
    }
  });
  document.getElementById('footNum').textContent = total.toLocaleString('en-IN');
  document.getElementById('footSub').textContent = count
    ? parts.slice(0, 2).join(', ') + (parts.length > 2 ? ` +${parts.length - 2} more` : '')
    : 'No items selected';
  document.getElementById('obtn').disabled = total === 0;
}

function placeOrder() {
  const name  = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim().replace(/\D/g, '');
  if (!name)             { shake('custName');  return; }
  if (phone.length < 10) { shake('custPhone'); return; }

  const cart = [];
  let total = 0;
  document.querySelectorAll('.qi').forEach(el => {
    const qty = parseInt(el.value || 0);
    if (qty > 0) {
      const price = Number(el.dataset.price || 0);
      cart.push({ name: el.dataset.name, qty, price });
      total += qty * price;
    }
  });
  if (!cart.length) return;

  const btn = document.getElementById('obtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Placing…';

  const itemsStr = cart.map(i => `${i.name} x${i.qty} (@₹${i.price})`).join(', ');
  const url = API + '?action=createOrder'
    + '&name='     + encodeURIComponent(name)
    + '&phone='    + encodeURIComponent(phone)
    + '&items='    + encodeURIComponent(itemsStr)
    + '&cartJson=' + encodeURIComponent(JSON.stringify(cart))
    + '&total='    + total
    + '&t='        + Date.now();

  fetch(url)
    .then(r => r.json())
    .then(r => {
      if (r.error) throw new Error(r.error);
      document.getElementById('soid').textContent = 'Order ID: ' + (r.orderId || '—');
      document.getElementById('sov').classList.add('show');
    })
    .catch(err => alert('❌ ' + err.message))
    .finally(() => {
      btn.innerHTML = '<i class="fas fa-shopping-bag"></i> Order Now';
      calc();
    });
}

function resetOrder() {
  document.querySelectorAll('.qi').forEach(el => el.value = 0);
  calc();
  document.getElementById('sov').classList.remove('show');
}

function shake(id) {
  const el = document.getElementById(id);
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
}
</script>
</body>
</html>
