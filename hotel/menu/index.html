<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apna Dhaba — Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Root scales with viewport — everything in rem auto-fits any screen */
    html { font-size: clamp(16px, 4.5vw, 22px); }

    :root {
      --blue:        #2563eb;
      --blue-dark:   #1d4ed8;
      --blue-light:  #3b82f6;
      --blue-bg:     #eff6ff;
      --blue-bg2:    #dbeafe;
      --border:      #bfdbfe;
      --text:        #1e3a5f;
      --text-sub:    #3b5a7a;
      --text-muted:  #7ea8cc;
      --green:       #16a34a;
      --red:         #dc2626;
      --white:       #ffffff;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(160deg, #dbeafe 0%, #e0f2fe 50%, #eff6ff 100%);
      min-height: 100vh;
      padding: clamp(10px, 2.5vw, 18px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* OUTER CARD */
    .card {
      width: 100%; flex: 1;
      background: var(--white);
      border: 2px solid var(--border);
      border-radius: clamp(14px, 3vw, 22px);
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(37,99,235,0.1), 0 1px 4px rgba(0,0,0,0.06);
    }

    /* HEADER */
    .hdr {
      background: linear-gradient(135deg, #1d4ed8, #2563eb 50%, #3b82f6);
      padding: 0.75rem 1rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .hdr-logo {
      width: 2.4rem; height: 2.4rem; border-radius: 0.6rem; flex-shrink: 0;
      background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; font-weight: 900; color: #fff;
    }
    .hdr-title { font-size: 1.1rem; font-weight: 900; color: #fff; }
    .hdr-sub   { font-size: 0.6rem; color: rgba(255,255,255,0.65); margin-top: 0.1rem; }
    .hdr .live {
      margin-left: auto; flex-shrink: 0;
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; font-size: 0.58rem; font-weight: 700;
      padding: 0.22rem 0.55rem; border-radius: 2rem;
      display: flex; align-items: center; gap: 0.28rem;
    }
    .ldot { width: 0.35rem; height: 0.35rem; border-radius: 50%; background: #4ade80; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.6)} 50%{box-shadow:0 0 0 0.3rem rgba(74,222,128,0)} }

    /* CUSTOMER */
    .cust {
      background: var(--blue-bg);
      border-bottom: 2px solid var(--border);
      padding: 0.7rem 0.9rem;
    }
    .cust-lbl { font-size: 0.6rem; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 0.45rem; }
    .cust-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
    .fw { display: flex; flex-direction: column; gap: 0.18rem; }
    .fw label { font-size: 0.6rem; font-weight: 700; color: var(--text-sub); }
    .fw input {
      background: var(--white); border: 2px solid var(--border);
      border-radius: 0.5rem; padding: 0.5rem 0.65rem;
      color: var(--text); font-family: inherit; font-size: 0.8rem; font-weight: 600; outline: none;
      transition: border-color .15s; width: 100%;
    }
    .fw input:focus { border-color: var(--blue); }
    .fw input::placeholder { color: var(--text-muted); font-weight: 400; }

    /* MENU BODY */
    .mbody { padding: 0.5rem; background: #f8fbff; }

    /* SPINNER */
    .loading { display: flex; flex-direction: column; align-items: center; padding: 3rem 1rem; gap: 0.7rem; }
    .spin { width: 2.2rem; height: 2.2rem; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--text-muted); font-size: 0.82rem; }

    /* CATEGORY BLOCK */
    .cat-block { margin-bottom: 0.45rem; border-radius: 0.75rem; overflow: hidden; border: 1.5px solid var(--border); background: var(--white); }

    .cat-head {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 0.9rem;
      cursor: pointer; user-select: none;
      background: var(--blue-bg);
      transition: background .18s;
    }
    .cat-block.open .cat-head {
      background: linear-gradient(135deg, #1d4ed8, #2563eb 60%, #3b82f6);
    }
    .cat-emoji { font-size: 1.05rem; flex-shrink: 0; }
    .cat-name  { flex: 1; font-size: 0.95rem; font-weight: 800; color: var(--blue); transition: color .18s; }
    .cat-block.open .cat-name { color: #fff; }
    .cat-pill {
      font-size: 0.58rem; font-weight: 700; padding: 0.14rem 0.42rem; border-radius: 2rem;
      background: rgba(37,99,235,0.12); color: var(--blue); transition: all .18s; flex-shrink: 0;
    }
    .cat-block.open .cat-pill { background: rgba(255,255,255,0.25); color: #fff; }
    .cat-arr { font-size: 0.62rem; color: var(--blue); transition: transform .28s cubic-bezier(.34,1.56,.64,1); flex-shrink: 0; }
    .cat-block.open .cat-arr { transform: rotate(180deg); color: rgba(255,255,255,0.9); }

    .cat-panel { max-height: 0; overflow: hidden; transition: max-height .38s cubic-bezier(.4,0,.2,1); }
    .cat-block.open .cat-panel { max-height: 3000px; }

    /* ITEM ROW */
    .item-row {
      border-bottom: 1px solid var(--blue-bg2);
      cursor: pointer;
      transition: background .18s;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: var(--blue-bg); }

    /* top part — always visible */
    .item-top {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.75rem 0.9rem;
    }

    .vdot {
      width: 0.78rem; height: 0.78rem; flex-shrink: 0; border-radius: 0.18rem; border: 2px solid;
      display: flex; align-items: center; justify-content: center; align-self: center;
    }
    .vdot::after { content:''; width: 0.3rem; height: 0.3rem; border-radius: 50%; background: currentColor; }
    .vdot.veg     { color: var(--green); border-color: var(--green); }
    .vdot.non-veg { color: var(--red);   border-color: var(--red); }

    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .item-desc { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* tap hint */
    .tap-hint {
      font-size: 0.6rem; color: var(--text-muted); font-weight: 600;
      display: flex; align-items: center; gap: 0.2rem; flex-shrink: 0;
    }
    .item-row.expanded .tap-hint { display: none; }

    /* EXPAND SECTION */
    .item-expand { max-height: 0; overflow: hidden; transition: max-height .3s cubic-bezier(.4,0,.2,1); }
    .item-row.expanded .item-expand { max-height: 120px; }

    .item-expand-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 0.9rem 0.8rem;
      gap: 0.6rem;
    }
    .item-price { font-size: 1.05rem; font-weight: 900; color: var(--blue-dark); }

    .qty { display: flex; align-items: center; flex-shrink: 0; }
    .qb {
      width: 2rem; height: 2rem;
      background: var(--blue-bg); border: 2px solid var(--border);
      color: var(--blue); font-size: 1.1rem; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .15s; user-select: none; touch-action: manipulation;
    }
    .qb:first-child { border-radius: 0.45rem 0 0 0.45rem; }
    .qb:last-child  { border-radius: 0 0.45rem 0.45rem 0; }
    .qb:hover, .qb:active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .qi {
      width: 2.2rem; height: 2rem;
      background: var(--white); border: 2px solid var(--border); border-left: none; border-right: none;
      color: var(--text); text-align: center; font-family: inherit; font-size: 0.9rem; font-weight: 800; outline: none;
    }
    .qi::-webkit-inner-spin-button, .qi::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* TOTAL */
    .footer {
      background: var(--blue-bg);
      border-top: 2px solid var(--border);
      padding: 0.9rem 1rem 1.4rem;
    }
    .foot-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.65rem; }
    .foot-lbl { font-size: 0.6rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: .08em; }
    .foot-sub { font-size: 0.6rem; color: var(--text-muted); margin-top: 0.18rem; }
    .foot-amt .sym { font-size: 1rem; color: var(--blue); font-weight: 800; }
    .foot-amt .num { font-size: 1.8rem; font-weight: 900; color: var(--text); letter-spacing: -.03em; }
    .obtn {
      width: 100%;
      background: linear-gradient(135deg, #1d4ed8, #2563eb 50%, #3b82f6);
      border: none; border-radius: 0.7rem; padding: 0.9rem;
      color: #fff; font-family: inherit; font-size: 1rem; font-weight: 900;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: opacity .15s, transform .15s;
      box-shadow: 0 4px 20px rgba(37,99,235,0.3);
      touch-action: manipulation;
    }
    .obtn:hover:not(:disabled) { opacity: .9; transform: translateY(-2px); }
    .obtn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    /* SUCCESS */
    .sov {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center; padding: 1rem;
    }
    .sov.show { display: flex; }
    .sbox {
      background: #fff; border: 2px solid var(--border); border-radius: 1.2rem;
      padding: 1.8rem 1.4rem; text-align: center; max-width: 22rem; width: 100%;
      animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn { from{opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
    .sbox .si { font-size: 3rem; margin-bottom: 0.6rem; }
    .sbox h2  { font-size: 1.2rem; font-weight: 900; color: var(--text); margin-bottom: 0.4rem; }
    .sbox p   { color: var(--text-muted); font-size: 0.8rem; line-height: 1.65; }
    .soid { margin: 0.85rem 0; background: var(--blue-bg); border: 1.5px solid var(--border); border-radius: 0.5rem; padding: 0.5rem 0.9rem; font-size: 0.75rem; font-weight: 700; color: var(--blue-dark); }
    .sclose { width: 100%; background: linear-gradient(135deg,#1d4ed8,#3b82f6); border: none; border-radius: 0.65rem; padding: 0.85rem; color: #fff; font-family: inherit; font-size: 0.95rem; font-weight: 900; cursor: pointer; }

    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .shake { animation: shake .3s ease; }
  </style>
</head>
<body>

<div class="card">

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-logo">AD</div>
    <div>
      <div class="hdr-title">Apna Dhaba</div>
      <div class="hdr-sub">Tap an item to order</div>
    </div>
    <div class="live"><div class="ldot"></div> Live Menu</div>
  </div>

  <!-- CUSTOMER -->
  <div class="cust">
    <div class="cust-lbl"><i class="fas fa-user" style="margin-right:4px"></i>Your Details</div>
    <div class="cust-row">
      <div class="fw">
        <label>Full Name</label>
        <input type="text" id="custName" placeholder="Rahul Sharma" />
      </div>
      <div class="fw">
        <label>WhatsApp Number</label>
        <input type="tel" id="custPhone" placeholder="9876543210" maxlength="10" />
      </div>
    </div>
  </div>

  <!-- MENU -->
  <div class="mbody" id="mbody">
    <div class="loading">
      <div class="spin"></div>
      <p>Fetching menu…</p>
    </div>
  </div>

  <!-- TOTAL -->
  <div class="footer">
    <div class="foot-row">
      <div>
        <div class="foot-lbl">Total Amount</div>
        <div class="foot-sub" id="footSub">No items selected</div>
      </div>
      <div class="foot-amt"><span class="sym">₹</span><span class="num" id="footNum">0</span></div>
    </div>
    <button class="obtn" id="obtn" disabled onclick="placeOrder()">
      <i class="fas fa-shopping-bag"></i> Order Now
    </button>
  </div>

</div>

<!-- SUCCESS -->
<div class="sov" id="sov">
  <div class="sbox">
    <div class="si">🎉</div>
    <h2>Order Placed!</h2>
    <p>Your order is confirmed.<br>Invoice coming on WhatsApp.</p>
    <div class="soid" id="soid">Order ID: —</div>
    <button class="sclose" onclick="resetOrder()">Place Another Order</button>
  </div>
</div>

  'dessert':     'https://images.unsplash.com/photo-1587314168485-3236d6710814?w=150&q=80&fit=crop',
  'soups':       'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=150&q=80&fit=crop',
  'soup':        'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=150&q=80&fit=crop',
  'snacks':      'https://images.unsplash.com/photo-1553361371-9b22f78e8b1d?w=150&q=80&fit=crop',
  'chicken':     'https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=150&q=80&fit=crop',
  'paneer':      'https://images.unsplash.com/photo-1567188040759-fb8a883dc6d6?w=150&q=80&fit=crop',
  'dal':         'https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=150&q=80&fit=crop',
};

function getItemImg(name, cat) {
  const n = name.toLowerCase();
  for (const [kw, url] of IMG_MAP) {
    if (n.includes(kw)) return url;
  }
  return CAT_IMG[cat.toLowerCase()] || '';
}

fetch(API + '?action=getMenuItems&t=' + Date.now())
  .then(r => r.json())
  .then(r => {
    const items = (r.items || []).filter(m => ['yes','y'].includes(String(m['Available']||'').trim().toLowerCase()));
    buildMenu(items);
  })
  .catch(err => {
    document.getElementById('mbody').innerHTML =
      `<div style="text-align:center;padding:3rem 1rem;color:#b89ac8">
        <i class="fas fa-wifi-slash" style="font-size:2rem;display:block;margin-bottom:.6rem;color:#e0b0d0"></i>
        <p style="color:#1a0a2e;font-weight:700;font-size:.9rem">Couldn't load menu</p>
        <p style="font-size:.75rem;margin-top:.3rem"><a href="" style="color:#e74694">Tap to retry</a></p>
        <p style="font-size:.65rem;margin-top:.25rem;color:#c0a0b8">${err.message}</p>
      </div>`;
  });

function buildMenu(items) {
  if (!items.length) {
    document.getElementById('mbody').innerHTML = `<div style="text-align:center;padding:3rem;color:#b89ac8;font-size:.85rem">No items available.</div>`;
    return;
  }
  const grouped = {};
  items.forEach(m => {
    const cat = (m['Category'] || 'Other').trim();
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(m);
  });

  document.getElementById('mbody').innerHTML = Object.entries(grouped).map(([cat, catItems], ci) => `
    <div class="cat-block" id="cb${ci}">
      <div class="cat-head" onclick="tog(${ci})">
        <span class="cat-emoji">${ico(cat)}</span>
        <span class="cat-name">${cat}</span>
        <span class="cat-pill">${catItems.length}</span>
        <i class="fas fa-chevron-down cat-arr"></i>
      </div>
      <div class="cat-panel">
        ${catItems.map((m, j) => {
          const name  = (m['Item Name'] || m['Name'] || 'Item').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
          const price = Number(m['Price'] || m['Price (Rs)'] || 0);
          const desc  = m['Description'] || '';
          const isNv  = String(m['Type'] || m['Veg/Non-Veg'] || '').toLowerCase().includes('non');
          const uid   = 'q' + ci + '_' + j;
          return `
          <div class="item-row" id="row_${uid}" onclick="toggleItem('${uid}')">
            <div class="item-top">
              <div class="vdot ${isNv ? 'non-veg' : 'veg'}"></div>
              <div class="item-info">
                <div class="item-name">${name}</div>
                ${desc ? `<div class="item-desc">${desc}</div>` : ''}
              </div>
              <div class="tap-hint"><i class="fas fa-plus-circle" style="color:#e74694"></i></div>
            </div>
            <div class="item-expand">
              <div class="item-expand-inner">
                <div class="item-price">₹${price}</div>
                <div class="qty">
                  <button class="qb" onclick="event.stopPropagation();chg('${uid}',-1)">−</button>
                  <input class="qi" type="number" id="${uid}" value="0" min="0" max="20"
                    data-name="${name}" data-price="${price}"
                    onclick="event.stopPropagation()"
                    oninput="clamp(this);calc()" />
                  <button class="qb" onclick="event.stopPropagation();chg('${uid}',1)">＋</button>
                </div>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}

// Toggle category
function tog(ci) {
  const el = document.getElementById('cb' + ci);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.cat-block.open').forEach(b => b.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}

// Toggle item expand
function toggleItem(uid) {
  const row = document.getElementById('row_' + uid);
  const wasExpanded = row.classList.contains('expanded');
  // close all others in same category panel
  row.closest('.cat-panel').querySelectorAll('.item-row.expanded').forEach(r => r.classList.remove('expanded'));
  if (!wasExpanded) {
    row.classList.add('expanded');
    // auto-set qty to 1 if still 0
    const inp = document.getElementById(uid);
    if (inp && parseInt(inp.value) === 0) { inp.value = 1; calc(); }
  } else {
    // collapsing — reset qty to 0
    const inp = document.getElementById(uid);
    if (inp) { inp.value = 0; calc(); }
  }
}

function chg(id, d) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = Math.max(0, Math.min(20, parseInt(el.value || 0) + d));
  calc();
}
function clamp(el) {
  let v = parseInt(el.value || 0);
  el.value = isNaN(v) || v < 0 ? 0 : v > 20 ? 20 : v;
}

function calc() {
  let total = 0, parts = [], count = 0;
  document.querySelectorAll('.qi').forEach(el => {
    const qty = parseInt(el.value || 0);
    if (qty > 0) {
      total += qty * Number(el.dataset.price || 0);
      parts.push(el.dataset.name + ' ×' + qty);
      count++;
    }
  });
  document.getElementById('footNum').textContent = total.toLocaleString('en-IN');
  document.getElementById('footSub').textContent = count
    ? parts.slice(0, 2).join(', ') + (parts.length > 2 ? ` +${parts.length - 2} more` : '')
    : 'No items selected';
  document.getElementById('obtn').disabled = total === 0;
}

function placeOrder() {
  const name  = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim().replace(/\D/g, '');
  if (!name)             { shake('custName');  return; }
  if (phone.length < 10) { shake('custPhone'); return; }

  const cart = [];
  let total = 0;
  document.querySelectorAll('.qi').forEach(el => {
    const qty = parseInt(el.value || 0);
    if (qty > 0) {
      const price = Number(el.dataset.price || 0);
      cart.push({ name: el.dataset.name, qty, price });
      total += qty * price;
    }
  });
  if (!cart.length) return;

  const btn = document.getElementById('obtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Placing…';

  const itemsStr = cart.map(i => `${i.name} x${i.qty} (@₹${i.price})`).join(', ');
  fetch(API + '?action=createOrder'
    + '&name='     + encodeURIComponent(name)
    + '&phone='    + encodeURIComponent(phone)
    + '&items='    + encodeURIComponent(itemsStr)
    + '&cartJson=' + encodeURIComponent(JSON.stringify(cart))
    + '&total='    + total + '&t=' + Date.now())
    .then(r => r.json())
    .then(r => {
      if (r.error) throw new Error(r.error);
      document.getElementById('soid').textContent = 'Order ID: ' + (r.orderId || '—');
      document.getElementById('sov').classList.add('show');
    })
    .catch(err => alert('❌ ' + err.message))
    .finally(() => { btn.innerHTML = '<i class="fas fa-shopping-bag"></i> Order Now'; calc(); });
}

function resetOrder() {
  document.querySelectorAll('.qi').forEach(el => el.value = 0);
  document.querySelectorAll('.item-row.expanded').forEach(r => r.classList.remove('expanded'));
  calc();
  document.getElementById('sov').classList.remove('show');
}

function shake(id) {
  const el = document.getElementById(id);
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
}
</script>
